<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FURIA Chat - IA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <img src="./images/furiapng.png" alt="FURIA Logo" class="logo">
            <h1>FURIA Chat</h1>
            <div class="team-status" id="team-status">Online</div>
        </div>
        
        <div class="chat-messages" id="chat-messages">
        </div>
        
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Pergunte sobre a FURIA..." autocomplete="off">
            <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
